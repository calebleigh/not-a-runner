# Builds the Android app on every push to master and publishes it as a GitHub release.
# The app checks the latest release and offers the APK when it's newer than itself.
name: Android APK

on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**/*.md", "design/**", "reference/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # One number per build; Android installs an update only when it's higher than the installed one.
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/notarunner.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/notarunner.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: notarunner
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/not-a-runner-$APP_VERSION_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$APP_VERSION_CODE" "$RUNNER_TEMP/not-a-runner-$APP_VERSION_NAME.apk" \
            --title "$APP_VERSION_NAME" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
