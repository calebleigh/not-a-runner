<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Dev-only page for choosing the app mark. Not part of the production build. */
  :root{--paper:#111110;--surface:#1B1A19;--line:#2E2B28;--ink:#F4F1EC;--muted:#9A958F;--accent:#FF6A13;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0b0b0a;color:var(--ink);font:500 14px "Barlow",system-ui,sans-serif;padding:24px}
  h1{font:800 28px "Barlow Condensed",system-ui;margin:0 0 4px}
  p.lead{color:var(--muted);margin:0 0 20px}
  .concept{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
  .concept h2{font:800 22px "Barlow Condensed",system-ui;margin:0 0 4px}
  .concept small{color:var(--muted);display:block;line-height:1.4}
  .row{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
  .tile{display:grid;place-items:center;border-radius:22%;overflow:hidden}
  .tile svg{width:78%;height:78%}
  .f .t-orange svg{width:60%;height:60%}
  .t-dark{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
  .t-orange{background:linear-gradient(145deg,#FF8A3D,#E5540A)}
  .t-white{background:#F4F1EC}
  .big{width:132px;height:132px}.med{width:72px;height:72px}.sm{width:40px;height:40px}
  .lockup{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
  .lockup svg{width:46px;height:46px}
  .word{font:800 italic 34px/0.9 "Barlow Condensed",system-ui;letter-spacing:-.01em}
  .word span{display:block;font:700 13px "Barlow",system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-style:normal;margin-bottom:3px}
</style>
</head>
<body>
<h1>Not a Runner: logo concepts</h1>
<p class="lead">Each concept at app icon size and small, on charcoal, orange and light, plus a wordmark.</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E5540A"/><stop offset=".55" stop-color="#FF6A13"/><stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <!-- Gradient for F, in its own coordinates; matches runningman.png. -->
    <linearGradient id="gf" x1="0" y1="841" x2="1028" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E95C14"/><stop offset="1" stop-color="#FA8A3C"/>
    </linearGradient>
    <!-- A: Stride. Classic running pictogram drawn in sharp, mitred strokes. -->
    <symbol id="a" viewBox="0 0 100 100">
      <circle cx="68" cy="15" r="9" stroke="none" />
      <g fill="none" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt">
        <polyline points="60,32 44,58 28,62 14,78" />
        <polyline points="44,58 64,68 56,88" />
        <polyline points="60,32 74,46 88,40" />
        <polyline points="60,32 44,34 36,46" />
      </g>
    </symbol>
    <!-- B: Italic N that breaks into a stride; dot for the head. -->
    <symbol id="b" viewBox="0 0 100 100">
      <circle cx="84" cy="16" r="9" stroke="none" />
      <g fill="none" stroke-width="12" stroke-linejoin="miter" stroke-miterlimit="10">
        <polyline points="14,84 30,30 56,74 70,30 86,46" />
      </g>
    </symbol>
    <!-- C: Walker. Upright, easy stride, arms swinging: moving, just not running. -->
    <symbol id="c" viewBox="0 0 100 100">
      <circle cx="52" cy="14" r="9" stroke="none" />
      <g fill="none" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="10">
        <polyline points="50,30 47,58" />
        <polyline points="47,58 37,73 31,90" />
        <polyline points="47,58 58,73 68,88" />
        <polyline points="50,32 40,46 36,60" />
        <polyline points="50,32 60,44 66,54" />
      </g>
    </symbol>
    <!-- F: Owner's running man (runningman.png), redrawn as vector. All strokes at 45 degrees, 109 units wide. -->
    <symbol id="f" viewBox="-41 -135 1110 1110">
      <polygon points="786,0 939,153 787,305 634,152" stroke="none" />
      <g fill="none" stroke-width="109" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt">
        <polyline points="190.5,329 390,130 789,528.5 988.5,329" />
        <polyline points="345,403 544.5,603 345,803" />
        <polyline points="38,803 275.5,565" />
      </g>
    </symbol>
    <!-- D: Zigzag stride. One continuous band, cut flat at the ground, diamond head. -->
    <clipPath id="ground"><rect x="0" y="0" width="100" height="84" /></clipPath>
    <symbol id="d" viewBox="0 0 100 100">
      <rect x="57" y="8" width="13" height="13" transform="rotate(45 63.5 14.5)" stroke="none" />
      <g fill="none" stroke-width="12" stroke-linejoin="miter" stroke-miterlimit="10" clip-path="url(#ground)">
        <polyline points="8,96 30,54 46,74 66,36 92,36" />
      </g>
    </symbol>
    <!-- E: NR ligature. Italic N whose last stem becomes an R; the R's leg kicks back like a stride. -->
    <symbol id="e" viewBox="0 0 100 100">
      <g fill="none" stroke-width="11" stroke-linejoin="miter" stroke-miterlimit="10" clip-path="url(#ground)">
        <polyline points="8,96 26,26 48,70 62,18" />
        <polyline points="58,22 86,22 80,48 56,48" />
        <polyline points="66,48 88,84" />
      </g>
    </symbol>
  </defs>
</svg>

<template id="concept">
  <section class="concept">
    <div><h2></h2><small></small></div>
    <div class="row"></div>
  </section>
</template>

<script>
  const CONCEPTS = [
    ["f", "F. Your running man", "Your design, redrawn as a vector so it stays sharp at every size and can change color. Your original PNG is first in the row for comparison."],
    ["d", "D. Zigzag stride", "One thick band that climbs and drops like a stride, cut flat where it meets the ground. Abstract, like your reference."],
    ["e", "E. NR ligature", "N and R share a stem; the R's leg kicks back like a runner's. A monogram for Not a Runner."],
    ["a", "A. Stride", "A runner in full stride, drawn in sharp angled strokes. Instantly reads as running."],
    ["b", "B. Running N", "An italic N for Not that kicks out into a stride, with a dot for the head. Works as a monogram."],
    ["c", "C. The walker", "Upright and relaxed, mid-step. The joke in the name: moving, just not running."],
  ];
  // Paint a mark: gradient on dark and light, solid dark on orange.
  const mark = (id, color) => {
    if (color === "url(#g)" && id === "f") color = "url(#gf)";
    return `<svg viewBox="0 0 100 100"><use href="#${id}" stroke="${color}" fill="${color}"/></svg>`;
  };
  for (const [id, name, note] of CONCEPTS) {
    const n = document.getElementById("concept").content.cloneNode(true);
    n.querySelector(".concept").classList.add(id);
    n.querySelector("h2").textContent = name;
    n.querySelector("small").textContent = note;
    n.querySelector(".row").innerHTML = (id === "f" ? `<div class="tile t-white big"><img src="/runningman.png" alt="Original PNG" style="width:78%"></div>` : "") + `
      <div class="tile t-dark big">${mark(id, "url(#g)")}</div>
      <div class="tile t-orange big">${mark(id, "#141210")}</div>
      <div class="tile t-white big">${mark(id, "url(#g)")}</div>
      <div class="tile t-dark med">${mark(id, "url(#g)")}</div>
      <div class="tile t-dark sm">${mark(id, "url(#g)")}</div>
      <div class="lockup">${mark(id, "url(#g)")}<div class="word"><span>Not a</span>Runner</div></div>`;
    document.body.appendChild(n);
  }
</script>
</body>
</html>
