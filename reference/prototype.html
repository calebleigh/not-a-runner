<title>St. George Half Training</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Half Training">
<meta name="theme-color" content="#111110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-thumb phone app. Bottom nav, one hero per screen, big condensed numerals, sheets slide up from the bottom. */
:root{
  --paper:#111110; --surface:#1B1A19; --surface2:#252321; --ink:#F4F1EC; --muted:#9A958F; --line:#2E2B28;
  --rock:#FF6A13; --rock-hi:#FF8A3D; --rock-lo:#E5540A; --rock-soft:#33200F; --sage:#FF6A13; --sage-soft:#211A14; --sky:#FFA35C; --sky-soft:#24201B; --bar:#33302D;
  --on-accent:#141210; --bad:#FF5A4F; --bad-soft:#3A1A17; --good:#7BD88F;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ color-scheme:dark } }
:root[data-theme="light"],:root[data-theme="dark"]{ color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html{overflow-y:scroll;scrollbar-gutter:stable;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#3a3734;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button,input,summary{color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible,.tap:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.lbl{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--display);font-weight:800;line-height:.9;letter-spacing:-.01em}
.unit{font:600 15px var(--body);color:var(--muted);margin-left:3px;letter-spacing:0}
.tap{cursor:pointer;transition:transform .18s var(--ease),background .2s}
.tap:active{transform:scale(.97)}
.stack{display:flex;flex-direction:column;gap:14px}
.view{animation:viewIn .38s var(--ease) both}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view[hidden]{display:none!important}

/* Home */
.greet{display:flex;justify-content:space-between;align-items:center;gap:12px}
.greet h1{font-size:38px;font-weight:800;line-height:1;margin-top:4px}
.wkbadge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rock) var(--p,0%),var(--surface2) 0);position:relative}
.wkbadge::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--paper)}
.wkbadge span{position:relative;z-index:1;font:800 17px var(--display)}
.panelc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.vol .top{display:flex;justify-content:space-between;align-items:baseline}
.vol .top b{font:700 15px var(--display);color:var(--rock);letter-spacing:.02em}
.meter{position:relative;height:46px;border-radius:14px;background:var(--surface2);overflow:hidden;margin-top:10px}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#4a2a14,#7a3d14);border-right:3px solid var(--rock);transition:width .9s var(--ease)}
.meter .mtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.meter .mtxt .num{font-size:26px}
.meter .mtxt em{font:600 13px var(--body);font-style:normal;color:var(--muted);background:rgba(0,0,0,.35);padding:3px 8px;border-radius:8px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.d7{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
.d7 .t{width:100%;height:48px;border-radius:12px;background:var(--surface2);position:relative;overflow:hidden;transition:transform .18s var(--ease)}
.d7:active .t{transform:scale(.94)}
.d7 .t i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--rock-hi),var(--rock-lo));height:0;transition:height .7s var(--ease)}
.d7 .t.rest{background:repeating-linear-gradient(135deg,var(--surface2) 0 5px,var(--surface) 5px 10px)}
.d7.today .t{box-shadow:inset 0 0 0 2px var(--rock)}
.d7 small{font:700 12px var(--body);color:var(--muted)}
.d7.today small{color:var(--rock)}

.hero{position:relative;border-radius:24px;padding:20px;min-height:168px;overflow:hidden;color:var(--on-accent);
  background:repeating-linear-gradient(135deg,rgba(0,0,0,.07) 0 14px,transparent 14px 28px),linear-gradient(135deg,var(--rock-hi),var(--rock-lo));
  background-size:40px 40px,100% 100%;animation:stripes 3.5s linear infinite;box-shadow:0 18px 40px -18px rgba(255,106,19,.55);border:0;text-align:left;width:100%;display:block}
@keyframes stripes{to{background-position:40px 0,0 0}}
.hero .lbl{color:rgba(20,18,16,.72)}
.hero .ht{padding-right:78px;font:800 italic clamp(44px,13vw,56px)/.92 var(--display);letter-spacing:-.02em;margin-top:8px;display:block}
.hero .ht .nw{white-space:nowrap}
.hero .ht small{font:800 italic 26px var(--display);opacity:.8;margin-left:6px}
.hero p{margin:10px 0 0;font-weight:600;padding-right:78px;color:rgba(20,18,16,.8);font-size:15px}
.hero .go{position:absolute;right:18px;top:50%;margin-top:-32px;width:64px;height:64px;border-radius:50%;background:rgba(20,18,16,.9);display:grid;place-items:center;color:var(--rock)}
.hero .go svg{width:26px;height:26px}
.hero.done{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;animation:none}
.hero.done .lbl{color:var(--rock)}
.hero.done p{color:var(--muted)}
.hero.done .go{background:var(--rock-soft)}
.hero.rest{background:repeating-linear-gradient(135deg,var(--surface2) 0 14px,var(--surface) 14px 28px);color:var(--ink);box-shadow:none;animation:none;border:1px solid var(--line)}
.hero.rest .lbl,.hero.rest p{color:var(--muted)}
.hstats{display:flex;gap:22px;margin-top:12px;padding-right:78px}
.hstats .num{font-size:30px}
.hstats .lbl{font-size:11px}

.chips{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
.qchip{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:left;cursor:pointer;transition:transform .18s var(--ease)}
.qchip:active{transform:scale(.96)}
.qchip .ic{width:34px;height:34px;border-radius:11px;background:var(--rock-soft);color:var(--rock);display:grid;place-items:center;margin-bottom:12px}
.qchip.ok .ic{background:var(--rock);color:var(--on-accent)}
.qchip .ic svg{width:18px;height:18px}
.qchip b{display:block;font:800 clamp(17px,5.2vw,22px)/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qchip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.3;color:var(--muted);margin-top:4px}

.coach{display:flex;gap:12px;align-items:flex-start;background:var(--rock-soft);border-radius:18px;padding:14px 16px;font-size:15px}
.coach.adj{background:var(--sky-soft)}
.coach .dot2{flex:none;width:8px;height:8px;border-radius:50%;background:var(--rock);margin-top:7px;box-shadow:0 0 0 5px rgba(255,106,19,.18)}
.coach button{background:none;border:0;color:var(--rock);font-weight:700;padding:0;margin-left:auto;cursor:pointer;flex:none}

.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px -4px}
.sechead button{background:none;border:0;color:var(--muted);font:600 14px var(--body);cursor:pointer;padding:0}
.last{position:relative;overflow:hidden}
.last svg.route{position:absolute;right:-10px;top:-6px;width:60%;height:120%;opacity:.25}
.last .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;position:relative}
.last .num{font-size:44px}
.last .tag{display:inline-block;font:600 13px var(--body);color:var(--muted);background:var(--surface2);padding:4px 10px;border-radius:8px}

/* Plan */
.planhead{border-radius:24px;padding:18px;background:radial-gradient(130% 120% at 100% 0%,rgba(255,106,19,.32),transparent 55%),linear-gradient(160deg,#2a1b11,var(--surface));border:1px solid var(--line)}
.pill2{display:inline-block;font:600 12px var(--body);background:rgba(255,255,255,.08);padding:4px 10px;border-radius:20px;color:var(--ink)}
.planhead h1{font-size:32px;font-weight:800;margin:10px 0 14px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio .num{font-size:28px}
.trio .lbl{font-size:11px;letter-spacing:.06em;text-transform:none;font-weight:500;margin-top:4px;display:block}
.prog{display:flex;align-items:center;gap:12px;margin-top:16px}
.prog .bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:6px;transition:width 1s var(--ease)}
.prog b{font:700 14px var(--body)}
.wpills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 6px;scrollbar-width:none;scroll-behavior:smooth}
.wpills::-webkit-scrollbar{display:none}
.wp{flex:none;width:52px;height:74px;border-radius:26px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0;cursor:pointer;color:var(--muted);font:700 14px var(--display);transition:transform .18s var(--ease),background .2s}
.wp:active{transform:scale(.94)}
.wp .st{width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.wp.full .st{background:var(--ink);color:var(--paper)}
.wp.part .st{background:conic-gradient(var(--rock) var(--p),var(--surface2) 0)}
.wp.sel{background:var(--rock);border-color:var(--rock);color:var(--on-accent)}
.wp.sel .st{background:rgba(20,18,16,.25)}
.wp.sel.full .st{background:var(--on-accent);color:var(--rock)}
.wp.cur:not(.sel){border-color:var(--rock);color:var(--rock)}
.wp svg{width:14px;height:14px}
.sess{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s var(--ease)}
.sess:active{transform:scale(.98)}
.sess::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--kc,var(--bar))}
.sess .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sess h3{font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px}
.sess .ck{width:20px;height:20px;border-radius:50%;background:var(--rock);color:var(--on-accent);display:inline-grid;place-items:center}
.sess .ck svg{width:12px;height:12px}
.sess .dt{font:700 15px var(--display);color:var(--muted)}
.sess.today .dt{color:var(--rock)}
.sess .r2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sess .r2 b{display:block;font:800 22px/1 var(--display)}
.sess .r2 span{font-size:12px;color:var(--muted)}

/* Stats */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;font:700 14px var(--body);padding:9px 0;border-radius:10px;cursor:pointer;color:var(--muted);transition:background .25s,color .25s}
.seg button.sel{background:var(--rock);color:var(--on-accent)}
.bigstat .num{font-size:88px}
.bigstat .unit{font-size:22px}
.split{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.split span{font:600 13px var(--body);background:var(--surface2);padding:6px 10px;border-radius:10px;color:var(--muted)}
.split b{color:var(--ink);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;position:relative}
.tile .ti{position:absolute;right:14px;top:14px;color:var(--rock);opacity:.9}
.tile .ti svg{width:20px;height:20px}
.tile .num{font-size:36px;margin-top:10px;display:block}
.chartc svg{display:block;width:100%}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.ocard .ohead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ocard .ohead h3{font-size:22px;font-weight:700}
.ocard .ohead span{font-size:13px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);margin:10px 0 0}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-of-type{border-bottom:0}
.goal b{font-weight:700}
.goal small{color:var(--muted);font-size:13px}
.tiers{display:flex;gap:6px;grid-column:1/-1}
.tiers span{flex:1;background:var(--surface2);border-radius:10px;padding:7px 8px;font:700 15px var(--display);text-align:center}
.tiers span em{display:block;font:500 11px var(--body);font-style:normal;color:var(--muted)}
.tiers span.hit{background:var(--rock);color:var(--on-accent)}
.tiers span.hit em{color:rgba(20,18,16,.7)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.weekstrip button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;font:600 12px var(--body)}
.weekstrip .bar{width:100%;max-width:30px;border-radius:8px;background:var(--bar);position:relative;height:72px;overflow:hidden}
.weekstrip .bar i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--rock-hi),var(--rock-lo));border-radius:8px;transition:height .7s var(--ease)}
.weekstrip .v{font:700 13px var(--display);color:var(--muted);min-height:16px}
.weekstrip .missing .bar{background:repeating-linear-gradient(45deg,var(--bar) 0 4px,var(--surface2) 4px 8px)}
.weekstrip .today .lbl2{color:var(--rock)}
.adjrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.adjrow:last-child{border-bottom:0}
.adjrow b{font-weight:600}.adjrow small{display:block;color:var(--muted);font-size:13px}
.big{font:800 40px/1 var(--display)}
.more{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--rock);font:600 14px var(--body);padding:12px 0 2px;cursor:pointer}

/* Profile */
.pagetitle{font-size:38px;font-weight:800}
.card.group{padding:4px 16px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);margin:0;font-weight:600}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:1px}
.unitin{display:flex;align-items:center;gap:6px}.unitin em{font-style:normal;color:var(--muted);font-weight:500}
.unitin input,.txtin{font:600 17px var(--body);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:96px;text-align:right}
.txtin{width:130px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.dot.on{background:var(--good);box-shadow:0 0 0 4px rgba(123,216,143,.15)}
.btnpair{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:7px 14px;font:600 14px var(--body);cursor:pointer}
.acc{border-bottom:1px solid var(--line)}.acc:last-child{border-bottom:0}
.acc summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--rock);font-weight:700}
.acc[open] summary::after{content:"\2212"}
.acc p{margin:-4px 0 14px;color:var(--muted);font-size:15px}
.grow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.grow .gcheck{position:relative;flex:none;width:26px;height:26px}
.grow .gcheck input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.box{width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0}
.grow .gcheck input:checked + .box{background:var(--rock);border-color:var(--rock)}
.grow .gcheck input:checked + .box svg{opacity:1}
.grow .gcheck input:focus-visible + .box{outline:3px solid var(--sky);outline-offset:2px}
.grow .gt{flex:1;min-width:0}
.grow .gt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gt small{color:var(--muted);font-size:13px}
.grow.owned .gt b{color:var(--muted)}
.grow .due{font:700 14px var(--display);color:var(--muted);white-space:nowrap}
.grow.overdue .due{color:var(--bad)}
.grow.soon .due{color:var(--rock)}
.ibtn{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);font:700 14px Georgia,serif;cursor:pointer}
.gwhy{font-size:14px;color:var(--muted);padding:0 0 12px 38px;margin-top:-4px;border-bottom:1px solid var(--line)}

/* Bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  background:rgba(20,19,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.bnav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px var(--body);padding:6px 0;cursor:pointer;transition:color .2s}
.bnav button svg{transition:transform .25s var(--ease)}
.bnav button.sel{color:var(--rock)}
.bnav button.sel svg{transform:translateY(-2px)}
.bnav .logbtn{justify-self:center;width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,var(--rock-hi),var(--rock-lo));color:var(--on-accent);margin-top:-28px;padding:0;justify-content:center;box-shadow:0 10px 24px -6px rgba(255,106,19,.6),0 0 0 6px var(--paper);transition:transform .2s var(--ease)}
.bnav .logbtn:active{transform:scale(.9) rotate(90deg)}
.bnav .logbtn svg{width:30px;height:30px}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
.sheet.open{background:rgba(0,0,0,.66);pointer-events:auto}
.sheet-body{background:var(--paper);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:10px 16px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .38s var(--ease)}
.sheet.open .sheet-body{transform:none}
.grabber{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h2{font-size:30px;font-weight:800}
.xbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px}
.sheet-body textarea{width:100%;min-height:120px;font:13px ui-monospace,Menlo,monospace;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);word-break:break-all;resize:none}
.msg{font-size:14px;color:var(--good);font-weight:600;margin-top:8px;min-height:1.2em}
.msg.err{color:var(--bad)}
.lead{color:var(--muted);font-size:15px;margin:0 0 12px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ltile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s var(--ease)}
.ltile:active{transform:scale(.96)}
.ltile .ic{width:38px;height:38px;border-radius:12px;background:var(--rock-soft);color:var(--rock);display:grid;place-items:center}
.ltile .ic svg{width:20px;height:20px}

const TARGET_PACE = [null, 16*60, 14*60+30, 13*60+15]; // sec per mile by phase, for jogging sessions
function idParts(id){ const [w,d,t]=id.split("-"); return {w:+w,d:+d,t}; }
function sortedLogs(){ return Object.entries(state.logs).sort((a,b)=>{const A=idParts(a[0]),B=idParts(b[0]);return A.w-B.w||A.d-B.d||(a[0]<b[0]?-1:1);}); }
const FOOTK=["walk","run","long","test"];
function effKind(n,d){
  const b=cardioBase(n,d); if(!b) return null;
  const sw=state.swaps[`${n}-${d}-c`];
  if(!sw) return {kind:b.kind,base:b.kind,swapped:false};

let FOOT={swapped:0,planned:0};
function computeFoot(){
  const from=new Date(today.getTime()-13*DAY), to=new Date(START.getTime()+(curWeek*7-1)*DAY);
  let sw=0,pl=0;
  for(let n=Math.max(1,curWeek-2);n<=curWeek;n++) for(let d=0;d<5;d++){
    const dt=new Date(START.getTime()+((n-1)*7+d)*DAY); if(dt<from||dt>to) continue;
    const e=effKind(n,d); if(!e||!FOOTK.includes(e.base)) continue;

}

let ADAPT = {run:0,bike:0,str:0,msg:{run:"",bike:"",str:""}};
function computeAdapt(){
  const res={run:0,bike:0,str:0,msg:{run:"No change yet. Log a few sessions.",bike:"No change yet. Log a few sessions.",str:"No change yet. Rate a few sessions."}};
  const win={run:[],bike:[],str:[]}, lim={run:[-2,1],bike:[-2,2],str:[-2,2]};
  for(const [id,lg] of sortedLogs()){
    const p=idParts(id); let kind;
    if(p.t==="s") kind="str"; else { const e=effKind(p.w,p.d); if(!e) continue; kind = e.kind==="bike"?"bike":(FOOTK.includes(e.kind)?"run":null); var paceOK = !e.swapped && e.kind!=="walk"; }
    if(!kind || !lg.feel) continue;

function runLogs(){ return sortedLogs().filter(([id,l])=>{ const p=idParts(id); if(p.t!=="c"||!l.dist||!l.time) return false; const e=effKind(p.w,p.d); return e && ["run","test","long","race","walk"].includes(e.kind); }); }

function predict(dist){ // Riegel from recent runs of 1+ miles
  const rl=runLogs().filter(([,l])=>l.dist>=1).slice(-8); let best=null;
  for(const [,l] of rl){ const t=l.time*Math.pow(dist/l.dist,1.06); if(!best||t<best) best=t; }
  return best;
}

/* ---------- Stats ---------- */
function renderStats(){
  const V=el("view-stats");
  const now=new Date(), mStart=new Date(now.getFullYear(),now.getMonth(),1), mEnd=new Date(now.getFullYear(),now.getMonth()+1,1);
  const inR = ovRange==="month" ? (d=>d>=mStart&&d<mEnd) : (()=>true);

  h+=`<section class="panelc bigstat"><span class="lbl">Total distance</span><div><span class="num">${N(mi,1)}</span><span class="unit">mi</span></div>
    <div class="split"><span>Walk <b>${T.walk.toFixed(1)}</b></span><span>Walk/run <b>${T.run.toFixed(1)}</b></span><span>Bike <b>${T.bike.toFixed(1)}</b></span></div></section>`;
  h+=`<div class="tiles">
    <div class="tile"><span class="ti">${IC.clock}</span><span class="lbl">Active time</span><span class="num">${N(T.secs/3600,1)}<span class="unit">hr</span></span></div>
    <div class="tile"><span class="ti">${IC.flame}</span><span class="lbl">Calories</span><span class="num">${N(T.cal,0,true)}</span></div>
    <div class="tile"><span class="ti">${IC.bolt}</span><span class="lbl">Workouts</span><span class="num">${N(wDone)}</span></div>
    <div class="tile"><span class="ti">${IC.steps}</span><span class="lbl">Steps</span><span class="num">${N(S.sum,0,true)}</span></div></div>`;
  // year volume
  { const max=Math.max(...weeks.map(w=>w.load)), bw=520/52, H=90;
    let bars=`<defs><linearGradient id="og" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#E5540A"/></linearGradient></defs>`;
    weeks.forEach((w,i)=>{ const hh=8+(H-14)*w.load/max, x=i*bw+1, f=weekFrac(w);
      bars+=`<rect x="${x}" y="${H-hh}" width="${bw-2}" height="${hh}" rx="2" fill="#33302D"/>`;
      if(f>0) bars+=`<rect x="${x}" y="${H-hh*f}" width="${bw-2}" height="${hh*f}" rx="2" fill="url(#og)"/>`;
      if(w.n===curWeek) bars+=`<rect x="${x+bw/2-1}" y="0" width="2" height="${H}" fill="#F4F1EC" opacity=".7"/>`; });
    h+=`<section class="ocard chartc"><div class="ohead"><h3>The year</h3><span>Week ${curWeek} of 52</span></div><svg viewBox="0 0 520 ${H}" preserveAspectRatio="none" style="height:${H}px" role="img" aria-label="Planned training load by week, completed portion filled">${bars}</svg>
      <div class="split" style="justify-content:space-between;margin-top:6px"><span>Oct</span><span>Jan</span><span>Apr</span><span>Jul</span><span>Race</span></div></section>`; }
  // steps
  { const days=[]; for(let i=6;i>=0;i--) days.push(new Date(today.getTime()-i*DAY));
    const mx=Math.max(8000,...days.map(dt=>state.steps[dayKey(dt)]||0)), SA=stepStats(()=>true);
    h+=`<section class="ocard"><div class="ohead"><h3>Steps</h3><span>${SA.days?`${kfmt(SA.avg)} avg a day`:"Tap a day to add"}</span></div><div class="weekstrip">${days.map((dt,i)=>{ const before=dt<START, v=before?0:(state.steps[dayKey(dt)]||0);
      return `<button class="${i===6?"today ":""}${!v&&!before?"missing":""}" data-sd="${+dt}" ${before?"disabled":""} aria-label="${dt.toLocaleDateString("en-US",{weekday:"long"})}: ${v?v+" steps":"not logged"}"><span class="v">${v?kfmt(v):""}</span><span class="bar"><i data-dir="h" data-w="${Math.round(100*v/mx)}%" style="height:0"></i></span><span class="lbl2">${i===6?"Today":dt.toLocaleDateString("en-US",{weekday:"short"}).slice(0,2)}</span></button>`; }).join("")}</div>
      <p class="foot">Striped days are missing. Tap one to fill it in.</p></section>`; }
  // goals
  { const hp=predict(13.1);
    h+=`<section class="ocard"><div class="ohead"><h3>Goal times</h3><span>${hp?`Half outlook ${hms(hp)}`:"Log runs for a prediction"}</span></div>${GOALS.map(g=>{ const best=bestFor(g.dist), pr=predict(g.dist);

  // weight
  { const ws=Object.entries(state.weights).map(([w,v])=>[+w,v]).sort((a,b)=>a[0]-b[0]); const start=state.settings.startWt||(ws[0]&&ws[0][1]);

      if(ws.length>=2){ const all=[start,...ws.map(x=>x[1])], mn=Math.min(...all)-2, mx=Math.max(...all)+2, X=w=>((w-1)/51)*500+10, Y=v=>100-(v-mn)/(mx-mn)*90; const pts=ws.map(([w,v])=>`${X(w).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
        h+=`<svg viewBox="0 0 520 110" preserveAspectRatio="none" style="width:100%;height:100px;margin-top:8px" role="img" aria-label="Weight by week"><line x1="10" x2="510" y1="${Y(start)}" y2="${Y(start)}" stroke="#2E2B28" stroke-dasharray="4 4"/><polyline points="${pts}" fill="none" stroke="#FF6A13" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`; }
      h+=`<p class="foot">${ws.length>=4?"A steady 0.5 to 1.5 lb a week is a healthy pace.":"Give it a few weeks before reading much into it."}</p>`; }
    h+=`</section>`; }
  // adjustments
  { h+=`<section class="ocard"><div class="ohead"><h3>Plan adjustments</h3><span>From your logs</span></div>`+[["run","Running and walking"],["bike","Biking"],["str","Strength"]].map(([k,lab])=>{ const v=ADAPT[k]; const pill=k==="str"?(v===0?"On plan":v>0?`+${v*2} reps`:`${v*2} reps`):pctTxt(v);
      return `<div class="adjrow"><div><b>${lab}</b><small>${esc(ADAPT.msg[k])}</small></div><span class="pill ${v>0?"up":v<0?"down":""}">${pill}</span></div>`; }).join("");
    const hrs=runLogs().map(([,l])=>l.hr).filter(Boolean).slice(-6); const notes=[];
    if(hrs.length){ const avg=Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length); notes.push(`Avg heart rate ${avg} bpm${avg>150?", high for easy days.":", a good easy range."}`); }
    if(TARGET_PACE[phaseOf(curWeek)]) notes.push(`Strong pace this phase: ${hms(TARGET_PACE[phaseOf(curWeek)])}/mi.`);
    h+=`<p class="foot">${notes.join(" ")||"Three strong sessions step it up 10%. Two tough ones ease it back."}</p></section>`; }
  // history
  { const all=sortedLogs().filter(([id,l])=>idParts(id).t==="c"&&l.time).reverse();
    h+=`<section class="ocard"><div class="ohead"><h3>History</h3><span>${all.length} sessions</span></div>`;
    if(!all.length) h+=`<p class="foot" style="margin:0">Nothing logged yet. Tap the orange button after your next session.</p>`;
    h+=(renderStats.all?all:all.slice(0,4)).map(([id,l])=>{ const p=idParts(id), b=cardioFor(p.w,p.d);
      return `<div class="adjrow"><div><b>${dateOf(p.w,p.d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}: ${esc(b.t)}</b><small>${[l.dist?`${l.dist} mi in ${hms(l.time)}`:hms(l.time), l.dist?(b.kind==="bike"?mph(l.time,l.dist):pace(l.time,l.dist)):null, l.hr?`${l.hr} bpm`:null].filter(Boolean).join(", ")}</small></div><span class="pill ${l.feel==="easy"?"up":l.feel==="hard"?"down":""}">${FEEL[l.feel]||""}</span></div>`; }).join("");
    if(all.length>4) h+=`<button class="more" id="histMore">${renderStats.all?"Show less":`Show all ${all.length}`}</button>`;
    h+=`</section>`; }
  V.innerHTML=h;
  V.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ ovRange=b.dataset.r; try{localStorage.setItem("sgOvRange",ovRange);}catch(e){} renderStats(); countUp(V); });
  V.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>stepsSheet(new Date(+b.dataset.sd)));
  const hm=el("histMore"); if(hm) hm.onclick=()=>{ renderStats.all=!renderStats.all; renderStats(); };
  growBars(V);
}

(async()=>{

    setSync("Saved to your account");

})();
